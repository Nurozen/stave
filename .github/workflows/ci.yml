name: CI

on:
  push:
    branches: [weirwood]
  pull_request:
    branches: [weirwood]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25.2"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Build (windows cross-compile)
        run: go build ./...
        env:
          GOOS: windows

      - name: Vet
        run: go vet ./...

      - name: Unit Tests
        run: go test -race -count=1 -timeout 300s ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.2"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          install-mode: goinstall
          version: v2.1.6
          args: --timeout=5m
